name: MathOS Remaining Official Source Fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - tools/mathos_fetch_remaining_official.py
      - .github/workflows/mathos-official-source-fetch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition and verification dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf gdown
      - name: Fetch remaining official originals
        run: python tools/mathos_fetch_remaining_official.py
      - name: Build physical artifact manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('MathOS-remaining-official-sources')
          (root / 'index').mkdir(parents=True, exist_ok=True)
          rows = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for block in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(block)
                  rows.append({
                      'path': p.relative_to(root).as_posix(),
                      'size_bytes': p.stat().st_size,
                      'sha256': h.hexdigest(),
                  })
          (root / 'index' / 'artifact-manifest.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('artifact_files', len(rows))
          PY
      - name: Upload candidates and full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathOS-remaining-official-sources
          path: MathOS-remaining-official-sources
          if-no-files-found: error
          retention-days: 7
